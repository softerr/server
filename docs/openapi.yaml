      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionInput'
      responses:
        '201':
          description: Question created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Invalid template, prompt, or template config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Quiz already has 100 questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/questions/order:
    parameters:
      - name: quizId
