          description: Completed attempt with saved answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttempt'
        '401':
          description: No active session.
        '404':
          description: Attempt not found.

  /quiz/quizzes/{quizId}/questions:
    parameters:
      - name: quizId
        in: path
        required: true
        schema:
          type: integer
          format: int64
