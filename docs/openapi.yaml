openapi: 3.1.0
info:
  title: Softerr API
  version: 1.0.0
  description: |
    Account signup, email verification, login, admin user and backup access, password reset, quiz library, and shared media API. Most PHP responses are JSON; backup downloads are ZIP files. Nginx may return
    redirects or HTML error pages before a request reaches PHP, notably for
    oversized or rate-limited requests. Clients should use HTTP status codes
    and should not assume every error response has a JSON body.
servers:
  - url: /api
    description: API path on the same host as the client-configured origin
tags:
  - name: Health
  - name: Verification
  - name: Authentication
  - name: Administration
  - name: Quizzes
  - name: Musico
  - name: Media
paths:
  /:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check API readiness
      description: |
        Checks the verification URL configuration, ZIP support, all four PostgreSQL
        databases, and their required schemas. It does not check email delivery.
        Use `/api/`; Nginx redirects `/api` to `/api/`.
      responses:
        '200':
          description: API is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ok
                message: API is ready
        '503':
          description: API configuration or database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessUnavailable'
              example:
                status: unavailable
                error: Database connection failed

  /musico/me:
    put:
      tags: [Musico]
      operationId: ensureMusicoUser
      summary: Get or create the current user's Musico account
      description: The Musico user is stored in the Musico database and linked to the shared auth user ID. Repeated requests return the same app-local ID.
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '200':
          description: The current Musico account.
          content:
            application/json:
              schema:
                type: object
                required: [id, auth_user_id]
                properties:
                  id:
                    type: integer
                    format: int64
                  auth_user_id:
                    type: integer
                    format: int64
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /musico/changes:
    get:
      tags: [Musico]
      operationId: getMusicoChanges
      summary: Get an initial library snapshot or changes after a cursor
      description: Without `after`, returns a consistent snapshot of track metadata, playlists with ordered track IDs, and an opaque cursor. Save that cursor after applying the snapshot. With `after`, returns up to `limit` changes; advance to `next_cursor` only after applying the page, then repeat while `has_more` is true. A cursor that no longer identifies the same change-log entry returns 409 with `reset_required`; discard the cursor and fetch a new snapshot. Upsert entries identify objects to fetch from the track or playlist detail endpoint. Delete entries are tombstones. Audio bytes are fetched separately.
      security:
        - sessionCookie: []
        - mobileBearer: []
      parameters:
        - name: after
          in: query
          required: false
          schema: {$ref: '#/components/schemas/MusicoCursor'}
        - name: limit
          in: query
          required: false
          description: Available only with `after`.
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Initial snapshot when `after` is omitted; otherwise a page of changes.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/MusicoSnapshot'}
                  - {$ref: '#/components/schemas/MusicoChangePage'}
        '400': {description: Invalid cursor or limit.}
        '401': {description: No active session.}
        '409':
          description: Cursor no longer matches the change history; fetch a fresh snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [error, reset_required]
                properties:
                  error: {type: string}
                  reset_required: {type: boolean, const: true}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/tracks:
    get:
      tags: [Musico]
      operationId: listMusicoTracks
      summary: List your uploaded tracks
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '200':
          description: Tracks ordered newest first.
          content:
            application/json:
              schema:
                type: object
                required: [tracks, phone_order, usage, limits]
                properties:
                  tracks:
                    type: array
                    items:
                      $ref: '#/components/schemas/MusicoTrack'
                  phone_order:
                    type: array
                    description: Server track IDs in the most recently synced phone's default song order. Other tracks follow these in the web library.
                    items: {type: integer, format: int64, minimum: 1}
                  usage:
                    type: object
                    required: [bytes]
                    properties:
                      bytes: { type: integer, minimum: 0 }
                  limits:
                    type: object
                    required: [bytes, per_file_bytes]
                    properties:
                      bytes: { type: integer, const: 6442450944 }
                      per_file_bytes: { type: integer, minimum: 1 }
        '401': {description: No active session.}
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Musico]
      operationId: uploadMusicoTrack
      summary: Upload one audio file
      description: MP3, Ogg, WAV, FLAC, and M4A are accepted. Each file is at most 24 MiB; each user's library is limited to 6 GiB. The server computes SHA-256 from the file bytes. Reuploading identical bytes for the same account returns the existing track without changing its metadata or consuming quota. Clients should send a new UUID in Idempotency-Key for each intended upload and reuse it when retrying that upload. Keys are retained for 30 days, including when the uploaded track is deleted.
      security:
        - sessionCookie: []
        - mobileBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: UUID identifying one intended upload. Reuse it only with the same file, filename, and metadata when retrying.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                title: {type: string, maxLength: 200}
                artist: {type: string, maxLength: 200}
                album: {type: string, maxLength: 200}
                genre: {type: string, maxLength: 200}
                year: {type: integer, minimum: 1800, maximum: 2100}
                track_number: {type: integer, minimum: 1, maximum: 999}
      responses:
        '201':
          description: Uploaded track.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicoTrack' }
        '200':
          description: A retry or an identical audio file already exists on this account; returns the existing track.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicoTrack' }
        '400': {description: Invalid file or metadata.}
        '401': {description: No active session.}
        '409': {description: Idempotency-Key was reused for a different upload, or the original track was deleted.}
        '413': {description: File or user storage limit exceeded.}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/tracks/order:
    put:
      tags: [Musico]
      operationId: saveMusicoTrackOrder
      summary: Set the web library order from a phone
      description: Replaces the account's phone order. Submit the server track IDs in the same order as the phone's default Songs view. Songs absent from the list follow those supplied. The most recently synced phone determines the order.
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_ids]
              properties:
                track_ids:
                  type: array
                  maxItems: 50000
                  uniqueItems: true
                  items: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Order saved.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: {type: integer, minimum: 0}
        '400': {description: Invalid, duplicate, or unavailable track ID.}
        '401': {description: No active session.}
        '413': {description: Request body is too large.}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/tracks/from-media:
    post:
      tags: [Musico]
      operationId: createMusicoTrackFromMedia
      summary: Add an owned Media audio file as a Musico song
      description: Returns the existing song if this audio file is already in Musico. The file remains in Media when the song is deleted.
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_audio_id]
              properties:
                media_audio_id: {type: integer, format: int64, minimum: 1}
      responses:
        '200': {description: Song already exists, content: {application/json: {schema: {$ref: '#/components/schemas/MusicoTrack'}}}}
        '201': {description: Song created, content: {application/json: {schema: {$ref: '#/components/schemas/MusicoTrack'}}}}
        '400': {description: Invalid audio ID.}
        '401': {description: No active session.}
        '404': {description: Audio file not found in your Media library.}
        '413': {description: Request body is too large.}
        '500': {$ref: '#/components/responses/InternalError'}

  /musico/tracks/{trackId}:
    parameters:
      - name: trackId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [Musico]
      operationId: getMusicoTrack
      summary: Get one of your tracks by ID
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '200':
          description: Current track metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicoTrack' }
        '401': {description: No active session.}
        '404': {description: Track not found or belongs to another account.}
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Musico]
      operationId: updateMusicoTrack
      summary: Edit a song's metadata and rating
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, artist, album, genre]
              properties:
                title: {type: string, maxLength: 200, minLength: 1}
                artist: {type: string, maxLength: 200}
                album: {type: string, maxLength: 200}
                genre: {type: string, maxLength: 200}
                year: {type: [integer, 'null'], minimum: 1800, maximum: 2100}
                track_number: {type: [integer, 'null'], minimum: 1, maximum: 999}
                rating: {type: [integer, 'null'], minimum: 0, maximum: 10}
                art_image_id: {type: [integer, 'null'], minimum: 1}
      responses:
        '200':
          description: Updated song.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MusicoTrack'}
        '400': {description: Invalid metadata.}
        '401': {description: No active session.}
        '404': {description: Track not found in your library.}
        '412': {description: Track version changed; reload before retrying.}
        '428': {description: If-Match is required.}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Musico]
      operationId: deleteMusicoTrack
      summary: Delete a track from your library and all playlists
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '204': {description: Track deleted.}
        '400': {description: Invalid If-Match.}
        '401': {description: No active session.}
        '404': {description: Track not found in your library.}
        '412': {description: Track version changed; reload before retrying.}
        '428': {description: If-Match is required.}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/tracks/{trackId}/listen:
    parameters:
      - name: trackId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    post:
      tags: [Musico]
      operationId: recordMusicoListen
      summary: Record a play or listening time for an owned track
      description: Send a fresh UUID for each listening event. Reuse it for retries. Receipts are retained for the account lifetime, and a replay returns the original totals without adding the event again.
      parameters:
        - {$ref: '#/components/parameters/MusicoStatisticRequestId'}
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                started: {type: boolean}
                milliseconds: {type: integer, minimum: 0, maximum: 60000}
      responses:
        '200':
          description: Updated listening totals.
          content:
            application/json:
              schema:
                type: object
                required: [play_count, listen_ms, stats_version]
                properties:
                  play_count: {type: integer, minimum: 0}
                  listen_ms: {type: integer, minimum: 0}
                  stats_version: {type: integer, format: int64, minimum: 1}
        '400': {description: Invalid listening activity.}
        '401': {description: No active session.}
        '404': {description: Track not found in your library.}
        '409': {description: Idempotency-Key was used for a different statistic request.}
        '428': {description: Idempotency-Key is required.}
        '500': {$ref: '#/components/responses/InternalError'}

  /musico/tracks/{trackId}/analysis:
    parameters:
      - name: trackId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    put:
      tags: [Musico]
      operationId: saveMusicoTrackAnalysis
      summary: Save measured audio properties for an owned track
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      description: Replaces the track's stored analysis. Values may be null when the browser cannot determine them.
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MusicoAnalysis'}
      responses:
        '200':
          description: Saved analysis.
          content:
            application/json:
              schema:
                type: object
                required: [analysis, version]
                properties:
                  analysis: {$ref: '#/components/schemas/MusicoAnalysis'}
                  version: {type: integer, format: int64, minimum: 1}
        '400': {description: Invalid analysis.}
        '401': {description: No active session.}
        '404': {description: Track not found in your library.}
        '412': {description: Track version changed; reload before retrying.}
        '413': {description: Request body is too large.}
        '428': {description: If-Match is required.}
        '500': {$ref: '#/components/responses/InternalError'}

  /musico/tracks/{trackId}/restore-stats:
    parameters:
      - name: trackId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    post:
      tags: [Musico]
      operationId: restoreMusicoTrackStats
      summary: Restore listening totals from a library export
      parameters:
        - {$ref: '#/components/parameters/MusicoStatsVersion'}
        - {$ref: '#/components/parameters/MusicoStatisticRequestId'}
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [play_count, listen_ms]
              properties:
                play_count: {type: integer, minimum: 0, maximum: 1000000000}
                listen_ms: {type: integer, minimum: 0, maximum: 1000000000000000}
      responses:
        '200':
          description: Restored listening totals.
          content:
            application/json:
              schema:
                type: object
                required: [play_count, listen_ms, stats_version]
                properties:
                  play_count: {type: integer, minimum: 0}
                  listen_ms: {type: integer, minimum: 0}
                  stats_version: {type: integer, format: int64, minimum: 1}
        '400': {description: Invalid statistics.}
        '401': {description: No active session.}
        '409': {description: Idempotency-Key was used for a different statistic request.}
        '404': {description: Track not found in your library.}
        '412': {description: Statistics changed; reload before retrying.}
        '428': {description: If-Match or Idempotency-Key is required.}
        '500': {$ref: '#/components/responses/InternalError'}

  /musico/tracks/{trackId}/file:
    parameters:
      - name: trackId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [Musico]
      operationId: streamMusicoTrack
      summary: Stream an owned track
      description: Supports one byte range through the Range header and returns 206 with Content-Range for partial content.
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '200':
          description: Complete audio file.
          content:
            audio/mpeg: {schema: {type: string, format: binary}}
            audio/ogg: {schema: {type: string, format: binary}}
            audio/wav: {schema: {type: string, format: binary}}
            audio/flac: {schema: {type: string, format: binary}}
            audio/mp4: {schema: {type: string, format: binary}}
        '206':
          description: Requested byte range.
          content:
            audio/mpeg: {schema: {type: string, format: binary}}
            audio/ogg: {schema: {type: string, format: binary}}
            audio/wav: {schema: {type: string, format: binary}}
            audio/flac: {schema: {type: string, format: binary}}
            audio/mp4: {schema: {type: string, format: binary}}
        '401': {description: No active session.}
        '404': {description: Track not found in your library.}
        '416': {description: Invalid or unsatisfiable range.}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/playlists:
    get:
      tags: [Musico]
      operationId: listMusicoPlaylists
      summary: List your playlists
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '200':
          description: Playlists ordered newest first.
          content:
            application/json:
              schema:
                type: object
                required: [playlists]
                properties:
                  playlists:
                    type: array
                    items: { $ref: '#/components/schemas/MusicoPlaylist' }
        '401': {description: No active session.}
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Musico]
      operationId: createMusicoPlaylist
      summary: Create a playlist
      description: Send a new UUID in Idempotency-Key for each intended playlist and reuse it for retries. A repeated key and name returns the original playlist ID with its current state, even if it was later renamed. A key cannot be reused for a different name or after the playlist is deleted. Creation receipts last for the account's lifetime.
      security:
        - sessionCookie: []
        - mobileBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: UUID identifying one intended playlist creation. Reuse with the same name when retrying.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: A retry of an earlier creation; returns the original playlist in its current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicoPlaylist' }
        '201':
          description: New playlist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicoPlaylist' }
        '400': {description: Invalid name.}
        '401': {description: No active session.}
        '409': {description: Idempotency-Key was used for a different name or the original playlist was deleted.}
        '413': {description: Request body is too large.}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/playlists/{playlistId}:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [Musico]
      operationId: getMusicoPlaylist
      summary: Get a playlist and its tracks
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '200':
          description: Playlist with ordered tracks.
          content:
            application/json:
              schema:
                type: object
                required: [playlist, tracks]
                properties:
                  playlist: { $ref: '#/components/schemas/MusicoPlaylist' }
                  tracks:
                    type: array
                    items: { $ref: '#/components/schemas/MusicoTrack' }
        '401': {description: No active session.}
        '404': {description: Playlist not found.}
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Musico]
      operationId: renameMusicoPlaylist
      summary: Rename a playlist
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: Renamed playlist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicoPlaylist' }
        '400': {description: Invalid name.}
        '401': {description: No active session.}
        '404': {description: Playlist not found.}
        '412': {description: Playlist version changed; reload before retrying.}
        '413': {description: Request body is too large.}
        '428': {description: If-Match is required.}
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Musico]
      operationId: deleteMusicoPlaylist
      summary: Delete a playlist while keeping its tracks
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '204': {description: Playlist deleted.}
        '400': {description: Invalid If-Match.}
        '401': {description: No active session.}
        '404': {description: Playlist not found.}
        '412': {description: Playlist version changed; reload before retrying.}
        '428': {description: If-Match is required.}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/playlists/{playlistId}/tracks:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    put:
      tags: [Musico]
      operationId: replaceMusicoPlaylistTracks
      summary: Replace a playlist's tracks in one atomic update
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      description: Track IDs must be unique and belong to the signed-in user's library.
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_ids]
              properties:
                track_ids:
                  type: array
                  uniqueItems: true
                  items: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Playlist tracks replaced.
          content:
            application/json:
              schema:
                type: object
                required: [track_ids, version]
                properties:
                  track_ids:
                    type: array
                    items: {type: integer, format: int64, minimum: 1}
                  version: {type: integer, format: int64, minimum: 1}
        '400': {description: Invalid track IDs or If-Match.}
        '401': {description: No active session.}
        '404': {description: Playlist or track not found in your library.}
        '412': {description: Playlist version changed; reload before retrying.}
        '413': {description: Request body is too large.}
        '428': {description: If-Match is required.}
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Musico]
      operationId: addMusicoPlaylistTrack
      summary: Add an owned track to a playlist
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      description: The same track can be in several playlists, once per playlist.
      security:
        - sessionCookie: []
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id: {type: integer, format: int64, minimum: 1}
      responses:
        '201':
          description: Track added to playlist.
          content:
            application/json:
              schema:
                type: object
                required: [track_id, version]
                properties:
                  track_id: {type: integer, format: int64}
                  version: {type: integer, format: int64, minimum: 1}
        '400': {description: Invalid track ID.}
        '401': {description: No active session.}
        '404': {description: Playlist or track not found in your library.}
        '409': {description: Track is already in this playlist.}
        '412': {description: Playlist version changed; reload before retrying.}
        '413': {description: Request body is too large.}
        '428': {description: If-Match is required.}
        '500': { $ref: '#/components/responses/InternalError' }

  /musico/playlists/{playlistId}/tracks/{trackId}:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      - name: trackId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    delete:
      tags: [Musico]
      operationId: removeMusicoPlaylistTrack
      summary: Remove a track from this playlist only
      parameters:
        - {$ref: '#/components/parameters/MusicoVersion'}
      security:
        - sessionCookie: []
        - mobileBearer: []
      responses:
        '204': {description: Track removed from playlist.}
        '400': {description: Invalid If-Match.}
        '401': {description: No active session.}
        '404': {description: Playlist track not found.}
        '412': {description: Playlist version changed; reload before retrying.}
        '428': {description: If-Match is required.}
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/signup:
    post:
      tags: [Verification]
      operationId: signup
      summary: Create an account and queue a verification email
      description: |
        The JSON request body is limited to 4096 bytes. Username is trimmed;
        email is trimmed and lowercased. Username is limited to 100 bytes,
        password to 1024 bytes, and email to 255 bytes after normalization.
        The server checks email syntax. A verification token expires after one
        hour. `verification_email_queued` means the email job was committed,
        not that a message was delivered. Requests are rate limited per client
        IP at 20 per minute with a burst allowance of 20.
      parameters:
        - $ref: '#/components/parameters/XTimezone'
        - $ref: '#/components/parameters/TimezoneHeader'
        - $ref: '#/components/parameters/TimezoneCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              username: john
              password: secret123
              email: john@example.com
              timezone: Europe/Vilnius
      responses:
        '201':
          description: Account created and verification email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              example:
                id: 1
                username: john
                email: john@example.com
                role: user
                verified: false
                approved: false
                created: '2026-10-26 14:30:00'
                verification_email_queued: true
        '400':
          description: Invalid JSON or missing or invalid account fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidJson:
                  value: { error: Invalid JSON body }
                invalidEmail:
                  value: { error: email is invalid }
        '409':
          description: Username or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: username or email already exists
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in to a verified and approved account
      description: |
        Email is trimmed and lowercased. A successful login creates a PHP
        session and sets an HttpOnly, SameSite=Strict cookie scoped to /api/.
        The cookie is Secure over HTTPS and expires when the browser closes;
        the server expires it after two hours of inactivity. Clients must send
        the cookie on later requests. Login is limited to 10 requests per
        minute per client IP, with a burst allowance of 10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; session cookie set.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Correct credentials, but email is unverified or account approval is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/mobile/login:
    post:
      tags: [Authentication]
      operationId: mobileLogin
      summary: Start a mobile session
      description: Uses the same verified and approved account credentials as browser login. Returns tokens in JSON and sets no cookie. Rate limited like browser login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/LoginRequest'}
                - type: object
                  properties:
                    device_name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: Mobile session created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileTokens'}
        '400': {description: Invalid credentials or device name.}
        '401': {description: Invalid email or password.}
        '403': {description: Verification or approval required.}
        '413': {description: Request body is too large.}
        '429': {description: Login rate limit exceeded.}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/mobile/refresh:
    post:
      tags: [Authentication]
      operationId: mobileRefresh
      summary: Rotate a mobile session's access and refresh tokens
      description: Store the new tokens before discarding the old ones. The old access token stops working immediately. If the response is lost, retry with the same old refresh token within 60 seconds to receive the identical new pair and its remaining lifetimes. A later refresh or logout closes that retry window. Refresh expires after 30 days of inactivity; a password change or account deactivation also invalidates it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, pattern: '^mrt_[A-Za-z0-9_-]{43}$'}
      responses:
        '200':
          description: Tokens rotated, or the same pair returned for a retry within 60 seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileTokens'}
        '400': {description: Invalid refresh token format.}
        '401': {description: Refresh token expired, rotated, or revoked.}
        '413': {description: Request body is too large.}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/mobile/logout:
    post:
      tags: [Authentication]
      operationId: mobileLogout
      summary: End one mobile session
      description: Revokes the session identified by its refresh token, including its current access token. Repeating logout succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, pattern: '^mrt_[A-Za-z0-9_-]{43}$'}
      responses:
        '200': {description: Logged out.}
        '400': {description: Invalid refresh token format.}
        '413': {description: Request body is too large.}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Get the account for the current session
      security:
        - sessionCookie: []
        - apiBearer: []
        - mobileBearer: []
      responses:
        '200':
          description: Verified account in the current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/users:
    get:
      tags: [Administration]
      operationId: listUsers
      summary: List human auth users
      description: Requires an approved, verified session whose current account role is admin. Results are ordered by ID and include unverified and pending human accounts; service accounts are managed through API tokens. Password hashes and tokens are never returned. The response is not cached.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: All auth users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/tokens:
    get:
      tags: [Authentication]
      operationId: listApiTokens
      summary: List up to 100 API tokens
      description: Browser session required. Lists only tokens created by the signed-in user, with active tokens first. Token secrets are never returned.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Token metadata.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: {$ref: '#/components/schemas/ApiToken'}
        '401': {description: No active session.}
        '403': {description: Browser session required.}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Authentication]
      operationId: createApiToken
      summary: Create a scoped API token
      description: Browser session required. Creates a separate service account with the supplied name. The token secret is returned once. Quiz access can cover selected creator-owned quizzes or all current and future quizzes. Set `expires_in_days` to null for no expiry.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expires_in_days]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                quiz_access: {$ref: '#/components/schemas/TokenQuizAccess'}
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, enum: ['quiz:read', 'quiz:write', 'media:read', 'media:write']}
                expires_in_days: {type: [integer, 'null'], minimum: 1, maximum: 365}
      responses:
        '201':
          description: New token secret, shown only in this response.
          content:
            application/json:
              schema:
                type: object
                required: [id, user_id, token, expires]
                properties:
                  id: {type: integer, minimum: 1}
                  user_id: {type: integer, minimum: 1, description: New service account ID.}
                  token: {type: string}
                  expires: {type: [string, 'null'], format: date-time}
        '400': {description: Invalid token settings.}
        '401': {description: No active session.}
        '403': {description: Browser session required or account inactive.}
        '413': {description: Request body is too large.}
        '429': {description: At most 100 active tokens and 20 new tokens per account per day.}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    delete:
      tags: [Authentication]
      operationId: revokeApiToken
      summary: Revoke an API token
      description: Creator's browser session required. Revocation takes effect on the next request.
      security:
        - sessionCookie: []
      responses:
        '204': {description: Token revoked.}
        '401': {description: No active session.}
        '403': {description: Browser session required.}
        '404': {description: Token not found.}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/tokens/{tokenId}/activity:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      tags: [Authentication]
      operationId: getApiTokenActivity
      summary: Get recent successful token actions
      description: Creator's browser session required. Returns up to 100 recent successful requests, including GET image reads, newest first.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Token activity.
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties:
                  activity:
                    type: array
                    items:
                      type: object
                      required: [id, method, path, status, created]
                      properties:
                        id: {type: integer, minimum: 1}
                        method: {type: string}
                        path: {type: string}
                        status: {type: integer}
                        created: {type: string, format: date-time}
        '401': {description: No active session.}
        '403': {description: Browser session required.}
        '404': {description: Token not found.}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/tokens/{tokenId}/quiz-access:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    patch:
      tags: [Authentication]
      operationId: updateApiTokenQuizAccess
      summary: Change a token's access to the creator's quizzes
      description: Creator's browser session required. Read grants require quiz:read; edit grants require quiz:read and quiz:write. Edit grants cannot delete the quiz.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quiz_access]
              properties:
                quiz_access: {$ref: '#/components/schemas/TokenQuizAccess'}
      responses:
        '200':
          description: Updated quiz access.
          content:
            application/json:
              schema:
                type: object
                required: [quiz_access]
                properties:
                  quiz_access: {$ref: '#/components/schemas/TokenQuizAccess'}
        '400': {description: Invalid quiz access or scope mismatch.}
        '401': {description: No active session.}
        '403': {description: Browser session required.}
        '404': {description: Token not found.}
        '409': {description: Token is revoked or expired.}
        '413': {description: Request body is too large.}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/backups:
    get:
      tags: [Administration]
      operationId: listBackups
      summary: List complete, restore-checked database backup sets
      description: Requires a current admin session. Each set contains auth, media, quiz, and musico archives from one backup run, newest first. Archives are stored on MEGA and downloaded to the server temporarily for ZIP creation. Responses are not cached.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Available backup sets.
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups:
                    type: array
                    items:
                      type: object
                      required: [id, created, size_bytes]
                      properties:
                        id: { type: string, pattern: '^\d{8}T\d{6}Z$' }
                        created: { type: string, format: date-time }
                        size_bytes: { type: integer, format: int64, minimum: 0 }
        '401':
          description: No active session.
        '403':
          description: Current account is not an admin.
        '503':
          description: Backup storage or an archive is unavailable.

  /auth/backups/{backupId}/download:
    parameters:
      - name: backupId
        in: path
        required: true
        schema: { type: string, pattern: '^\d{8}T\d{6}Z$' }
    get:
      tags: [Administration]
      operationId: downloadBackup
      summary: Download all three database archives in one ZIP
      description: Requires a current admin session. The ZIP contains auth.dump, quiz.dump, and media.dump. Responses are not cached.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Complete database backup.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401':
          description: No active session.
        '403':
          description: Current account is not an admin.
        '404':
          description: Backup set not found.
        '500':
          description: Could not assemble the ZIP.
        '503':
          description: Backup storage or an archive is unavailable.

  /auth/users/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [Administration]
      operationId: updateUserRole
      summary: Change an auth user's role
      description: Requires an approved, verified admin session and an approved, verified target. Admins cannot change their own role. A role change takes effect on the target user's next authenticated request.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Target user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Admin tried to change their own role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/users/{userId}/approve:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [Administration]
      operationId: approveUser
      summary: Approve a verified account
      description: Requires an approved admin session. The target must have verified their email and still be awaiting approval.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Approved user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Target user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Target is unverified, already approved, or deleting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags: [Administration]
      operationId: deleteUser
      summary: Delete an auth user and their quiz data
      description: |
        Requires a verified admin session. Admins cannot delete themselves.
        Deletion blocks the target account, removes its quiz database user and
        quizzes and its personal media images, then removes the auth database user and its tokens. If cleanup
        fails, the blocked account remains in the admin list so DELETE can be
        retried. Successful deletion cannot be undone.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: User and app data deleted.
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Target user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Admin tried to delete their own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      security: []
      responses:
        '200':
          description: Logged out; succeeds even when no session exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Returns the same response for unknown, unverified, and verified
        accounts. Verified accounts are limited to one queued request per
        ten minutes. Nginx limits requests per IP to 5 per minute with a burst of 5.
        The email worker creates a one-use link valid for 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted without disclosing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
        '400':
          description: Missing or invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Trusted public URL is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      description: |
        The token is a single-use 64-character hexadecimal value from the
        emailed quiz link. On success, existing sessions become invalid and a
        password-change notification is queued. The response does not log in
        the account. Nginx limits requests per IP to 10 per minute with a
        burst of 10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCompleted'
        '400':
          description: Malformed, expired, or used token, or invalid password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/resend-verification:
    post:
      tags: [Verification]
      operationId: resendVerification
      summary: Request another verification email
      description: |
        The response is the same whether the account is unknown, already
        verified, still within the one-minute resend cooldown, or eligible for
        another email. A token with ten minutes or less remaining is replaced.
        The JSON request body is limited to 4096 bytes. Email is trimmed,
        lowercased, and limited to 255 bytes. Requests are rate limited per
        client IP at 10 per minute with a burst allowance of 10.
      parameters:
        - $ref: '#/components/parameters/XTimezone'
        - $ref: '#/components/parameters/TimezoneHeader'
        - $ref: '#/components/parameters/TimezoneCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
            example:
              email: john@example.com
      responses:
        '202':
          description: Request accepted; no delivery guarantee or account disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendResponse'
              example:
                message: Verification email request accepted
        '400':
          description: Invalid JSON or missing or invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid email is required
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'

  /auth/verify:
    get:
      tags: [Verification]
      operationId: verifyAccount
      summary: Verify an account using an emailed token
      description: |
        The token is a one-time value. It must be unexpired when the account
        is locked for verification. On success, all verification tokens for
        the account are deleted. The emailed URL includes `view=html` so it
        displays a result page even in webviews with generic Accept headers.
        Requests with `Accept: text/html` also receive the page; other API
        requests receive JSON. The response is not cached.
      parameters:
        - name: token
          in: query
          required: true
          description: 64-character hexadecimal verification token from the email.
          schema:
            type: string
            pattern: '^[A-Fa-f0-9]{64}$'
        - name: view
          in: query
          required: false
          description: Set to `html` in emailed links to display a result page.
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Account verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                username: john
                email: john@example.com
                role: user
                verified: true
                approved: false
                created: '2026-10-26 14:30:00'
            text/html:
              schema:
                type: string
              description: Browser page confirming successful verification.
        '400':
          description: Token is malformed, invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                malformed:
                  value: { error: Invalid verification token }
                expiredOrUsed:
                  value: { error: Verification token is invalid or expired }
            text/html:
              schema:
                type: string
              description: Browser page explaining that verification failed.
        '500':
          description: Verification could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                type: string
              description: Browser page asking the user to try again later.

