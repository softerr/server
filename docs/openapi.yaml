openapi: 3.1.0
info:
  title: Softerr API
  version: 1.0.0
  description: |
    Account signup, email verification, login, admin user listing, password reset, quiz library, and shared media API. PHP responses are JSON. Nginx may return
    redirects or HTML error pages before a request reaches PHP, notably for
    oversized or rate-limited requests. Clients should use HTTP status codes
    and should not assume every error response has a JSON body.
servers:
  - url: /api
    description: API path on the same host as the client-configured origin
tags:
  - name: Health
  - name: Verification
  - name: Authentication
  - name: Administration
  - name: Quizzes
paths:
  /:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check API readiness
      description: |
        Checks the verification URL configuration, ZIP support, both PostgreSQL
        databases, and their required schemas. It does not check email delivery.
        Use `/api/`; Nginx redirects `/api` to `/api/`.
      responses:
        '200':
          description: API is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ok
                message: API is ready
        '503':
          description: API configuration or database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessUnavailable'
              example:
                status: unavailable
                error: Database connection failed

  /auth/signup:
    post:
      tags: [Verification]
      operationId: signup
      summary: Create an account and queue a verification email
      description: |
        The JSON request body is limited to 4096 bytes. Username is trimmed;
        email is trimmed and lowercased. Username is limited to 100 bytes,
        password to 1024 bytes, and email to 255 bytes after normalization.
        The server checks email syntax. A verification token expires after one
        hour. `verification_email_queued` means the email job was committed,
        not that a message was delivered. Requests are rate limited per client
        IP at 20 per minute with a burst allowance of 20.
      parameters:
        - $ref: '#/components/parameters/XTimezone'
        - $ref: '#/components/parameters/TimezoneHeader'
        - $ref: '#/components/parameters/TimezoneCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              username: john
              password: secret123
              email: john@example.com
              timezone: Europe/Vilnius
      responses:
        '201':
          description: Account created and verification email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              example:
                id: 1
                username: john
                email: john@example.com
                role: user
                verified: false
                approved: false
                created: '2026-10-26 14:30:00'
                verification_email_queued: true
        '400':
          description: Invalid JSON or missing or invalid account fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidJson:
                  value: { error: Invalid JSON body }
                invalidEmail:
                  value: { error: email is invalid }
        '409':
          description: Username or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: username or email already exists
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in to a verified and approved account
      description: |
        Email is trimmed and lowercased. A successful login creates a PHP
        session and sets an HttpOnly, SameSite=Strict cookie scoped to /api/.
        The cookie is Secure over HTTPS and expires when the browser closes;
        the server expires it after two hours of inactivity. Clients must send
        the cookie on later requests. Login is limited to 10 requests per
        minute per client IP, with a burst allowance of 10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; session cookie set.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Correct credentials, but email is unverified or account approval is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Get the account for the current session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Verified account in the current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/users:
    get:
      tags: [Administration]
      operationId: listUsers
      summary: List all auth users
      description: Requires an approved, verified session whose current account role is admin. Results are ordered by ID and include unverified and pending accounts. Password hashes and tokens are never returned. The response is not cached.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: All auth users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/users/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [Administration]
      operationId: updateUserRole
      summary: Change an auth user's role
      description: Requires an approved, verified admin session and an approved, verified target. Admins cannot change their own role. A role change takes effect on the target user's next authenticated request.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Target user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Admin tried to change their own role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/users/{userId}/approve:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [Administration]
      operationId: approveUser
      summary: Approve a verified account
      description: Requires an approved admin session. The target must have verified their email and still be awaiting approval.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Approved user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Target user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Target is unverified, already approved, or deleting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags: [Administration]
      operationId: deleteUser
      summary: Delete an auth user and their quiz data
      description: |
        Requires a verified admin session. Admins cannot delete themselves.
        Deletion blocks the target account, removes its quiz database user and
        quizzes and its personal media images, then removes the auth database user and its tokens. If cleanup
        fails, the blocked account remains in the admin list so DELETE can be
        retried. Successful deletion cannot be undone.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: User and app data deleted.
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Target user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Admin tried to delete their own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Logged out; succeeds even when no session exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Returns the same response for unknown, unverified, and verified
        accounts. Verified accounts are limited to one queued request per
        ten minutes. Nginx limits requests per IP to 5 per minute with a burst of 5.
        The email worker creates a one-use link valid for 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted without disclosing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
        '400':
          description: Missing or invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Trusted public URL is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      description: |
        The token is a single-use 64-character hexadecimal value from the
        emailed quiz link. On success, existing sessions become invalid and a
        password-change notification is queued. The response does not log in
        the account. Nginx limits requests per IP to 10 per minute with a
        burst of 10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCompleted'
        '400':
          description: Malformed, expired, or used token, or invalid password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/resend-verification:
    post:
      tags: [Verification]
      operationId: resendVerification
      summary: Request another verification email
      description: |
        The response is the same whether the account is unknown, already
        verified, still within the one-minute resend cooldown, or eligible for
        another email. A token with ten minutes or less remaining is replaced.
        The JSON request body is limited to 4096 bytes. Email is trimmed,
        lowercased, and limited to 255 bytes. Requests are rate limited per
        client IP at 10 per minute with a burst allowance of 10.
      parameters:
        - $ref: '#/components/parameters/XTimezone'
        - $ref: '#/components/parameters/TimezoneHeader'
        - $ref: '#/components/parameters/TimezoneCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
            example:
              email: john@example.com
      responses:
        '202':
          description: Request accepted; no delivery guarantee or account disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendResponse'
              example:
                message: Verification email request accepted
        '400':
          description: Invalid JSON or missing or invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid email is required
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '429':
          description: Rate limit exceeded; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'

  /auth/verify:
    get:
      tags: [Verification]
      operationId: verifyAccount
      summary: Verify an account using an emailed token
      description: |
        The token is a one-time value. It must be unexpired when the account
        is locked for verification. On success, all verification tokens for
        the account are deleted. The emailed URL includes `view=html` so it
        displays a result page even in webviews with generic Accept headers.
        Requests with `Accept: text/html` also receive the page; other API
        requests receive JSON. The response is not cached.
      parameters:
        - name: token
          in: query
          required: true
          description: 64-character hexadecimal verification token from the email.
          schema:
            type: string
            pattern: '^[A-Fa-f0-9]{64}$'
        - name: view
          in: query
          required: false
          description: Set to `html` in emailed links to display a result page.
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Account verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                username: john
                email: john@example.com
                role: user
                verified: true
                approved: false
                created: '2026-10-26 14:30:00'
            text/html:
              schema:
                type: string
              description: Browser page confirming successful verification.
        '400':
          description: Token is malformed, invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                malformed:
                  value: { error: Invalid verification token }
                expiredOrUsed:
                  value: { error: Verification token is invalid or expired }
            text/html:
              schema:
                type: string
              description: Browser page explaining that verification failed.
        '500':
          description: Verification could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                type: string
              description: Browser page asking the user to try again later.

  /media/images:
    get:
      tags: [Media]
      operationId: listImages
      summary: List personal and published shared images
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Shared images first, then personal images; each group is sorted by filename. Usage and limits cover personal images only.
          content:
            application/json:
              schema:
                type: object
                required: [images, usage, limits]
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuizImage'
                  usage:
                    type: object
                    required: [count, bytes]
                    properties:
                      count: {type: integer, minimum: 0}
                      bytes: {type: integer, minimum: 0}
                  limits:
                    type: object
                    required: [count, bytes, per_image_bytes]
                    properties:
                      count: {type: integer, minimum: 1}
                      bytes: {type: integer, minimum: 1}
                      per_image_bytes: {type: integer, minimum: 1}
        '401':
          description: No active session.
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Media]
      operationId: uploadImage
      summary: Upload or reuse a personal image
      description: PNG, JPEG, or WebP, at most 2 MiB and 4096 pixels per side. If identical bytes exist in the shared library, returns the shared entry without charging personal quota. Otherwise personal storage is limited to 256 images and 32 MiB across apps.
      security:
        - sessionCookie: []
      parameters:
        - name: X-Image-Name
          in: header
          required: true
          description: Original filename, percent encoded with encodeURIComponent or equivalent. Maximum 255 UTF-8 bytes after decoding; no path separators or control characters.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Image uploaded or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizImage'
        '400':
          description: Unsupported or invalid image.
        '401':
          description: No active session.
        '409':
          description: Personal image library is full.
        '413':
          description: Image is too large.
        '500':
          $ref: '#/components/responses/InternalError'

  /media/my-images:
    get:
      tags: [Media]
      operationId: listMyImages
      summary: List the signed-in user's personal images
      description: Published images appear in the shared library, not in this list. Usage covers personal images only.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Uploaded images with personal storage usage and limits.
          content:
            application/json:
              schema:
                type: object
                required: [images, usage, limits]
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuizImage'
                  usage:
                    type: object
                    required: [count, bytes]
                    properties:
                      count: {type: integer, minimum: 0}
                      bytes: {type: integer, minimum: 0}
                  limits:
                    type: object
                    required: [count, bytes, per_image_bytes]
                    properties:
                      count: {type: integer, minimum: 1}
                      bytes: {type: integer, minimum: 1}
                      per_image_bytes: {type: integer, minimum: 1}
        '401':
          description: No active session.
        '500':
          $ref: '#/components/responses/InternalError'

  /media/shared-images:
    get:
      tags: [Media]
      operationId: listSharedImages
      summary: List shared images and their folders
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Shared images, including ungrouped images.
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuizImage'
        '401':
          description: No active session.
        '500':
          $ref: '#/components/responses/InternalError'

  /media/groups:
    get:
      tags: [Media]
      operationId: listMediaGroups
      summary: List shared media folders
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Folders sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaGroup'
        '401':
          description: No active session.
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Media]
      operationId: createMediaGroup
      summary: Create a shared media folder
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaGroupInput'
      responses:
        '201':
          description: Folder created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGroup'
        '400':
          description: Invalid folder name.
        '401':
          description: No active session.
        '403':
          description: Admin access required.
        '409':
          description: A folder with the same name exists.
        '500':
          $ref: '#/components/responses/InternalError'

  /media/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: {type: integer, format: int64}
    patch:
      tags: [Media]
      operationId: renameMediaGroup
      summary: Rename a shared media folder
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaGroupInput'
      responses:
        '200':
          description: Folder renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGroup'
        '400':
          description: Invalid folder name.
        '401':
          description: No active session.
        '403':
          description: Admin access required.
        '404':
          description: Folder not found.
        '409':
          description: A folder with the same name exists.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Media]
      operationId: deleteMediaGroup
      summary: Delete folder and ungroup its images
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Folder deleted; images remain shared and ungrouped.
        '401':
          description: No active session.
        '403':
          description: Admin access required.
        '404':
          description: Folder not found.
        '500':
          $ref: '#/components/responses/InternalError'

  /media/images/{imageId}/group:
    parameters:
      - name: imageId
        in: path
        required: true
        schema: {type: integer, format: int64}
    patch:
      tags: [Media]
      operationId: moveSharedImage
      summary: Move a shared image into a folder or ungroup it
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: {type: [integer, 'null'], format: int64, minimum: 1}
      responses:
        '200':
          description: Image moved.
          content:
            application/json:
              schema:
                type: object
                required: [id, group_id]
                properties:
                  id: {type: integer, format: int64}
                  group_id: {type: [integer, 'null'], format: int64, minimum: 1}
        '400':
          description: Invalid group ID.
        '401':
          description: No active session.
        '403':
          description: Admin access required.
        '404':
          description: Group or shared image not found.
        '409':
          description: Group changed during the request.
        '500':
          $ref: '#/components/responses/InternalError'

  /media/images/{imageId}/publish:
    parameters:
      - name: imageId
        in: path
        required: true
        schema: {type: integer, format: int64}
    post:
      tags: [Media]
      operationId: publishImage
      summary: Publish an uploaded personal image
      description: Admin only. The image keeps its ID and uploader, becomes available to all users, and no longer counts toward personal storage.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Published image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizImage'
        '401':
          description: No active session.
        '403':
          description: Admin access required.
        '404':
          description: Image does not exist or is not a personal image owned by this admin.
        '409':
          description: Identical image bytes are already shared.
        '500':
          $ref: '#/components/responses/InternalError'

  /media/images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [Media]
      operationId: getImage
      summary: Read a personal or shared image
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Image bytes.
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        '401':
          description: No active session.
        '404':
          description: Image does not exist or belongs to another account.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Media]
      operationId: deleteImage
      summary: Delete an unused personal image
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Image deleted.
        '401':
          description: No active session.
        '404':
          description: Image does not exist or belongs to another account.
        '409':
          description: Image is still used by a saved question.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes:
    get:
      tags: [Quizzes]
      operationId: listQuizzes
      summary: List quizzes in the current account's library
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Quizzes, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [quizzes]
                properties:
                  quizzes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quiz'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Quizzes]
      operationId: createQuiz
      summary: Create a quiz in the current account's library
      description: |
        Name is trimmed and must contain 1–100 bytes. Description is trimmed and
        limited to 1000 bytes. The JSON body is limited to 4096 bytes. Each
        account can have up to 100 quizzes.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation; at most 100 bytes.
                description:
                  type: string
                  description: Trimmed before storage; at most 1000 bytes. Defaults to empty.
            example:
              name: Geography
      responses:
        '201':
          description: Quiz created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Missing or invalid quiz name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The account already has 100 quizzes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/import:
    post:
      tags: [Quizzes]
      operationId: importQuiz
      summary: Import a quiz JSON document or ZIP archive into the current account
      description: |
        Creates a new quiz and all of its questions atomically. The body is
        limited to 48 MiB and 100 questions. JSON uses version 1 with base64
        image data. A ZIP contains quiz.json and referenced image files. Send
        ZIP bytes as application/octet-stream. Existing quizzes are unchanged.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizExport'
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Imported quiz created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Invalid export format, quiz fields, or question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The account already has 100 quizzes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '415':
          description: Expected JSON or ZIP request body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/export.zip:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [Quizzes]
      operationId: exportQuizZip
      summary: Export an owned quiz as a ZIP archive
      description: ZIP contains quiz.json and each used image once under images/{imageId}/{originalFilename}. The manifest also preserves each original filename in its name field.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Portable quiz ZIP archive.
          content:
            application/zip:
              schema: {type: string, format: binary}
        '401':
          description: No active session.
        '404':
          description: Quiz does not exist or belongs to another account.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}:
    parameters:
      - name: quizId
        in: path
        required: true
        description: Quiz ID from the account's library.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Quizzes]
      operationId: getQuiz
      summary: Get a quiz owned by the current account
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Owned quiz.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Quizzes]
      operationId: updateQuiz
      summary: Update a quiz owned by the current account
      description: |
        Name is required. An omitted description retains its previous value.
        Description is trimmed and limited to 1000 bytes.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation; at most 100 bytes.
                description:
                  type: string
                  description: Trimmed before storage; at most 1000 bytes.
      responses:
        '200':
          description: Updated quiz.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Missing or invalid quiz name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Quizzes]
      operationId: deleteQuiz
      summary: Delete a quiz owned by the current account
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Quiz deleted; no response body.
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/questions:
    parameters:
      - name: quizId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Quizzes]
      operationId: listQuizQuestions
      summary: List questions in an owned quiz, in saved order
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Questions in the quiz.
          content:
            application/json:
              schema:
                type: object
                required: [questions]
                properties:
                  questions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Quizzes]
      operationId: createQuizQuestion
      summary: Add a question to an owned quiz
      description: A quiz can have up to 100 questions. Question create bodies are limited to 32768 bytes.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionInput'
      responses:
        '201':
          description: Question created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Invalid template, prompt, or template config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Quiz already has 100 questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/questions/order:
    parameters:
      - name: quizId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Quizzes]
      operationId: reorderQuizQuestions
      summary: Save the order of all questions in an owned quiz
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_ids]
              properties:
                question_ids:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: integer
                    format: int64
                    minimum: 1
      responses:
        '200':
          description: Question order saved.
          content:
            application/json:
              schema:
                type: object
                required: [question_ids]
                properties:
                  question_ids:
                    type: array
                    items:
                      type: integer
                      format: int64
        '400':
          description: Invalid question ID list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: IDs do not match the current question list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/questions/{questionId}:
    parameters:
      - name: quizId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: questionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [Quizzes]
      operationId: updateQuizQuestion
      summary: Replace an owned question's prompt, template, and config
      description: Question update bodies are limited to 32768 bytes.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionInput'
      responses:
        '200':
          description: Updated question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Invalid template, prompt, or template config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question or quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Quizzes]
      operationId: deleteQuizQuestion
      summary: Delete a question from an owned quiz
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Question deleted; no response body.
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question or quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: softerr_session
  parameters:
    XTimezone:
      name: X-Timezone
      in: header
      required: false
      description: |
        Preferred IANA timezone name for the email expiry timestamp, such as
        `Europe/Vilnius`. Invalid values are ignored. Precedence is this header,
        then the `Timezone` header, `timezone` cookie, and JSON `timezone` field.
      schema:
        type: string
      example: Europe/Vilnius
    TimezoneHeader:
      name: Timezone
      in: header
      required: false
      description: Fallback timezone if X-Timezone is absent or invalid.
      schema:
        type: string
    TimezoneCookie:
      name: timezone
      in: cookie
      required: false
      description: Fallback timezone if both timezone headers are absent or invalid.
      schema:
        type: string

  responses:
    InternalError:
      description: Internal or database failure; the error text may vary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VerificationUnavailable:
      description: Verification email URL is not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Verification email is not configured

  schemas:
    Quiz:
      type: object
      required: [id, name, description, created]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        created:
          type: string
          description: PostgreSQL timestamp without timezone, formatted as YYYY-MM-DD HH:MM:SS.
    QuizExport:
      type: object
      required: [format, version, name, description, questions, images]
      properties:
        format:
          type: string
          const: softerr-quiz
        version:
          type: integer
          const: 1
        name:
          type: string
          minLength: 1
          description: Trimmed before validation; at most 100 bytes.
        description:
          type: string
          description: Trimmed before validation; at most 1000 bytes.
        questions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuestionInput'
        images:
          type: array
          description: Each referenced image is included once as base64 data.
          maxItems: 4096
          items:
            type: object
            required: [id, name, data]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
                description: Original filename, at most 255 UTF-8 bytes.
              data:
                type: string
                contentEncoding: base64
    QuizImage:
      type: object
      required: [id, name, mime_type, width, height, size_bytes, scope, group_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Original uploaded filename.
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        width:
          type: integer
        height:
          type: integer
        size_bytes:
          type: integer
          minimum: 1
          description: Size of the stored image in bytes.
        scope:
          type: string
          enum: [personal, shared]
        group_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Shared media folder, or null for ungrouped and personal images.
    MediaGroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique folder name, at most 100 UTF-8 bytes after trimming.
    MediaGroup:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        image_count: {type: integer, minimum: 0}
        cover_image_id: {type: [integer, 'null'], format: int64, minimum: 1}
    QuestionInput:
      type: object
      required: [template, prompt, config]
      description: |
        `prompt` is trimmed and limited to 500 bytes. `config` depends on the
        template; see the question template table in docs/api.md. Choice, match,
        ordering, fill-in-the-blanks, and categorization templates have minimum
        row counts but no fixed maximum. Request size and prompt length still
        bound them. Answers and sample answers have the limits described there.
        Optional `config.image_id` and `config.answer_image_id` refer to reusable
        personal images owned by the account or published shared images. Choice options may also have `image_id`.
        Match pairs may use `keyword_image_id` and `definition_image_id`;
        categories may use `name_image_id`. Ordering items, blank answers, and
        category items are `{text, image_id?}` objects. The same
        image ID may be used in multiple fields.
      properties:
        template:
          type: string
          enum: [multiple_choice, one_choice, number, short_answer, open, true_false, yes_no, show_answer, no_answer, match, ordering, fill_blanks, categorize]
        prompt:
          type: string
          minLength: 1
          maxLength: 500
        config:
          type: object
      example:
        template: multiple_choice
        prompt: Select the prime numbers
        config:
          options:
            - {text: '2', correct: true}
            - {text: '3', correct: true}
            - {text: '4', correct: false}
    Question:
      allOf:
        - $ref: '#/components/schemas/QuestionInput'
        - type: object
          required: [id, quiz_id, created]
          properties:
            id:
              type: integer
              format: int64
            quiz_id:
              type: integer
              format: int64
            created:
              type: string
              description: PostgreSQL timestamp without timezone, formatted as YYYY-MM-DD HH:MM:SS.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Trimmed and lowercased; at most 255 bytes.
    PasswordResetRequested:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: If this account exists, a password reset email will be sent
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: At most 1024 bytes.
    PasswordResetCompleted:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Password updated. Please log in.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Trimmed and lowercased; at most 255 bytes.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: At most 1024 bytes.
    LogoutResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Logged out
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error; clients should use the HTTP status.
    Readiness:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: ok
        message:
          type: string
          const: API is ready
    ReadinessUnavailable:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          const: unavailable
        error:
          type: string
    SignupRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 1
          description: Trimmed before validation; must be nonempty and at most 100 bytes.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Must be nonempty and at most 1024 bytes.
        email:
          type: string
          format: email
          minLength: 1
          description: Trimmed and lowercased; must be at most 255 bytes.
        timezone:
          type: string
          description: Fallback IANA timezone if no valid header or cookie is supplied.
    ResendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Trimmed and lowercased; must be at most 255 bytes.
        timezone:
          type: string
          description: Fallback IANA timezone if no valid header or cookie is supplied.
    User:
      type: object
      required: [id, username, email, role, verified, approved, created]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, mod, user]
          description: Server-assigned account role. Signup always assigns user.
        verified:
          type: boolean
        approved:
          type: boolean
          description: True after an admin approves the verified account.
        created:
          type: string
          description: |
            PostgreSQL timestamp without timezone, usually formatted as
            `YYYY-MM-DD HH:MM:SS`. No timezone or UTC guarantee is encoded;
            clients should not parse it as an instant without an agreed timezone.
          example: '2026-10-26 14:30:00'
    UsersResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [deleting]
          properties:
            deleting:
              type: boolean
              description: Account is blocked while quiz data cleanup is pending; retry DELETE to finish.
    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, mod, user]
    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [verification_email_queued]
          properties:
            verification_email_queued:
              type: boolean
