          schema: {type: string, enum: ['1']}
          description: Delete after reviewing usage, even when referenced.
      responses:
        '204':
          description: Image deleted.
        '400':
          description: Invalid force option.
        '401':
          description: No active session.
        '403':
          description: Admin access required to delete a shared image.
        '404':
          description: Image does not exist or belongs to another account.
        '409':
          description: Image is used by a current quiz question or a saved attempt.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/explore:
    get:
      tags: [Quizzes]
      operationId: exploreQuizzes
      summary: List public quizzes, newest first
      security:
        - sessionCookie: []
        - apiBearer: []
      parameters:
        - name: before
          in: query
          description: Return public quizzes with IDs below this cursor.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Up to 50 public quizzes.
          content:
            application/json:
              schema:
                type: object
                required: [quizzes, next_before]
                properties:
                  quizzes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quiz'
                  next_before:
                    type: [integer, 'null']
                    format: int64
        '400':
          description: Invalid cursor.
        '401':
          description: No active session.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes:
    get:
      tags: [Quizzes]
      operationId: listQuizzes
      summary: List quizzes in the current account's library
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Quizzes, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [quizzes]
                properties:
                  quizzes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quiz'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Quizzes]
      operationId: createQuiz
      summary: Create a quiz in the current account's library
      description: |
        Name is trimmed and must contain 1–100 bytes. Description is trimmed and
        limited to 1000 bytes. The JSON body is limited to 4096 bytes. Each
        account can have up to 100 quizzes.
      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation; at most 100 bytes.
                description:
                  type: string
                  description: Trimmed before storage; at most 1000 bytes. Defaults to empty.
                play_style:
                  type: string
                  enum: [basic, game_show]
                  default: basic
                  description: Selects Basic or Game Show presentation.
                show_correct_answers:
                  type: boolean
                  default: false
                  description: Show solutions in reviews of completed attempts.
                is_public:
                  type: boolean
                  default: false
                  description: List the quiz in Explore and allow other signed-in users to play it.
                allow_go_back:
                  type: boolean
                  default: true
                  description: Allow players to return to earlier questions during an attempt.
                randomize_questions:
                  type: boolean
                  default: false
                randomize_answers:
                  type: boolean
                  default: false
                  description: Shuffle choice options, match keyword rows, and category labels for each attempt.
                question_limit:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 1000
                  default: null
                time_limit_seconds:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 86400
                  default: null
            example:
              name: Geography
      responses:
        '201':
          description: Quiz created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Missing or invalid quiz name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The account already has 100 quizzes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/import:
    post:
      tags: [Quizzes]
      operationId: importQuiz
      summary: Import a quiz JSON document or ZIP archive into the current account
      description: |
        Creates a new quiz and all of its questions atomically. The body is
        limited to 48 MiB and 100 questions. JSON uses version 1 with base64
        image data. A ZIP contains quiz.json and referenced image files. Send
        ZIP bytes as application/octet-stream. Existing quizzes are unchanged.
      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizExport'
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Imported quiz created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Invalid export format, quiz fields, or question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The account already has 100 quizzes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '415':
          description: Expected JSON or ZIP request body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/export.zip:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [Quizzes]
      operationId: exportQuizZip
      summary: Export an owned quiz or one visible through a service account grant
      description: ZIP contains quiz.json and each used image once under images/{imageId}/{filename}. The manifest also preserves each current filename in its name field.
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Portable quiz ZIP archive.
          content:
            application/zip:
              schema: {type: string, format: binary}
        '401':
          description: No active session.
        '404':
          description: Quiz does not exist or belongs to another account.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}:
    parameters:
      - name: quizId
        in: path
        required: true
        description: Quiz ID from the account's library.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Quizzes]
      operationId: getQuiz
      summary: Get an owned, granted, or public quiz, or a quiz with a prior attempt
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Quiz metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Quizzes]
      operationId: updateQuiz
      summary: Update a quiz owned by the current account
      description: |
        Name is required. An omitted description retains its previous value.
        Description is trimmed and limited to 1000 bytes.
      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation; at most 100 bytes.
                description:
                  type: string
                  description: Trimmed before storage; at most 1000 bytes.
                play_style:
                  type: string
                  enum: [basic, game_show]
                  description: Selects Basic or Game Show presentation. Omit to keep the current play style.
                show_correct_answers:
                  type: boolean
                  description: Omit to keep the current review setting.
                is_public:
                  type: boolean
                  description: Omit to keep the current visibility setting.
                allow_go_back:
                  type: boolean
                  description: Omit to keep the current navigation setting.
                randomize_questions:
                  type: boolean
                  description: Omit to keep the current order setting.
                randomize_answers:
                  type: boolean
                  description: Omit to keep the current answer order setting.
                question_limit:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 1000
                  description: Omit to keep the current limit; null selects All.
                time_limit_seconds:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 86400
                  description: Omit to keep the current limit; null removes it.
      responses:
        '200':
          description: Updated quiz.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Missing or invalid quiz name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Quizzes]
      operationId: deleteQuiz
      summary: Delete a quiz owned by the current account
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '204':
          description: Quiz deleted; no response body.
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/attempts:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: before
        in: query
        required: false
        description: Return attempts with IDs lower than this cursor.
        schema: { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
    get:
      tags: [Quizzes]
      operationId: listQuizAttempts
      summary: List the current player's attempts for an accessible quiz, 100 per page
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Attempt summaries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [attempts, next_before]
                properties:
                  attempts:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuizAttemptSummary'
                  next_before:
                    type: [integer, 'null']
                    description: Pass this as `before` to load the next page; null means there are no more attempts.
        '400':
          description: Invalid before cursor.
        '401':
          description: No active session.
        '404':
          description: Quiz not found.
    post:
      tags: [Quizzes]
      operationId: startQuizAttempt
      summary: Start or resume your attempt for an owned or public quiz
      description: An active attempt can be resumed after the quiz becomes private. A completed attempt remains available for review, but a new one cannot be started unless the quiz is public or owned by the player.
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Active attempt with its saved question snapshots and answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttempt'
        '401':
          description: No active session.
        '404':
          description: Quiz not found.
        '409':
          description: Quiz has no questions.

  /quiz/quizzes/{quizId}/attempts/{attemptId}:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: attemptId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Quizzes]
      operationId: getQuizAttempt
      summary: Get a saved attempt, its question snapshots, and answers
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Owned attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttempt'
        '401':
          description: No active session.
        '404':
          description: Attempt not found.

  /quiz/quizzes/{quizId}/attempts/{attemptId}/next:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: attemptId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Quizzes]
      operationId: nextQuizQuestion
      summary: Reveal the next question in an active attempt
      description: In Until finish mode, creates a new appearance. In fixed modes, reveals the next prepared appearance. Retrying with the same after ID returns the same next appearance.
      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [after]
              properties:
                after: { type: integer, minimum: 1, description: Current question appearance ID }
      responses:
        '200':
          description: Updated attempt with the next question visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttempt'
        '400':
          description: Invalid current question ID.
        '401':
          description: No active session.
        '404':
          description: Attempt or question not found.
        '409':
          description: Attempt is complete, the current question is invalid, or there are no more questions.
        '413':
          description: Request body exceeds 1024 bytes.

  /quiz/quizzes/{quizId}/attempts/{attemptId}/questions/{questionId}/reveal:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: attemptId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: questionId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Quizzes]
      operationId: revealQuizAnswer
      summary: Reveal an active Show answer question and save that it was revealed
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Answer text and optional image ID.
          content:
            application/json:
              schema:
                type: object
                required: [answer, answer_image_id]
                properties:
                  answer: { type: string }
                  answer_image_id: { type: [integer, 'null'] }
        '401':
          description: No active session.
        '404':
          description: Attempt or current Show answer question not found.
        '409':
          description: Attempt or question timer has expired, or going back is disabled.

  /quiz/quizzes/{quizId}/attempts/{attemptId}/questions/{questionId}/start:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: attemptId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: questionId
        in: path
        required: true
        description: Question appearance ID from the attempt.
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Quizzes]
      operationId: startAttemptQuestion
      summary: Start this question's clock once; repeated calls keep the original deadline
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '200':
          description: Updated attempt with the question deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttempt'
        '401':
          description: No active session.
        '404':
          description: Attempt or question not found.
        '409':
          description: Attempt is complete.

  /quiz/quizzes/{quizId}/attempts/{attemptId}/questions/{questionId}/time:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: attemptId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: questionId
        in: path
        required: true
        description: Question appearance ID from the attempt.
        schema: { type: integer, minimum: 1 }
    put:
      tags: [Quizzes]
      operationId: saveQuestionTime
      summary: Save cumulative foreground time spent viewing a reached question
      description: Repeated or out of order writes keep the greatest value. Time is measured by the client and is informational.
      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time_spent_ms]
              properties:
                time_spent_ms: { type: integer, minimum: 0, maximum: 2147483647 }
      responses:
        '200':
          description: Saved cumulative time in milliseconds.
          content:
            application/json:
              schema:
                type: object
                required: [time_spent_ms]
                properties:
                  time_spent_ms: { type: integer, minimum: 0 }
        '400':
          description: Invalid duration.
        '401':
          description: No active session.
        '404':
          description: Attempt or reached question not found.
        '413':
          description: Request body exceeds 256 bytes.

  /quiz/quizzes/{quizId}/attempts/{attemptId}/answers/{questionId}:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: attemptId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: questionId
        in: path
        required: true
        description: Question appearance ID from the attempt, not the source question ID.
        schema: { type: integer, minimum: 1 }
    put:
      tags: [Quizzes]
      operationId: saveQuizAnswer
      summary: Save or replace one answer in an unfinished attempt
      description: |
        The JSON body is limited to 32768 bytes. The answer is a template-specific
        object: `selected` for choices and booleans, `text` for number, short and
        open answers, `assignments` for match and categorize, `order` for ordering,
        `values` for blanks, `revealed` for show-answer, or `viewed` for no-answer.
      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: object
      responses:
        '200':
          description: Answer saved.
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean, const: true }
        '400':
          description: Invalid answer body.
        '401':
          description: No active session.
        '404':
          description: Attempt or question not found.
        '409':
          description: Attempt is complete or the question's time is up.
        '413':
          description: Request body exceeds 32768 bytes.

  /quiz/quizzes/{quizId}/attempts/{attemptId}/complete:
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: attemptId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Quizzes]
      operationId: completeQuizAttempt
