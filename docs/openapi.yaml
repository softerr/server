                  question_ids:
                    type: array
                    items:
                      type: integer
                      format: int64
        '400':
          description: Invalid question ID list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: IDs do not match the current question list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'

  /quiz/quizzes/{quizId}/questions/{questionId}:
    parameters:
      - name: quizId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: questionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [Quizzes]
      operationId: updateQuizQuestion
      summary: Replace an owned question's prompt, template, and config
      description: Question update bodies are limited to 32768 bytes.
      security:
        - sessionCookie: []
        - apiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionInput'
      responses:
        '200':
          description: Updated question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Invalid template, prompt, or template config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question or quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body is too large; Nginx may return a non-JSON body.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Quizzes]
      operationId: deleteQuizQuestion
      summary: Delete a question from an owned quiz
      security:
        - sessionCookie: []
        - apiBearer: []
      responses:
        '204':
          description: Question deleted; no response body.
        '401':
          description: No active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question or quiz does not exist or belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: softerr_session
    apiBearer:
      type: http
      scheme: bearer
      description: Admin-issued API token. Quiz and media endpoints require matching read or write scopes. Tokens cannot access administrator endpoints.
    mobileBearer:
      type: http
      scheme: bearer
      description: Short lived mobile access token from /auth/mobile/login or /auth/mobile/refresh. Accepted by Musico endpoints, GET /auth/me, GET /media/images routes, and POST /media/images for personal artwork uploads.
  parameters:
    MusicoVersion:
      name: If-Match
      in: header
      required: true
      description: Strong version tag from the current track or playlist, for example `"v3"`.
      schema: {type: string, pattern: '^"v[1-9][0-9]*"$'}
    MusicoStatsVersion:
      name: If-Match
      in: header
      required: true
      description: Strong listening statistics tag from the current track, for example `"s3"`.
      schema: {type: string, pattern: '^"s[1-9][0-9]*"$'}
    MusicoStatisticRequestId:
      name: Idempotency-Key
      in: header
      required: true
      description: New UUID for each intended statistic update; reuse the same key and request when retrying.
      schema: {type: string, format: uuid}
    XTimezone:
      name: X-Timezone
      in: header
      required: false
      description: |
        Preferred IANA timezone name for the email expiry timestamp, such as
        `Europe/Vilnius`. Invalid values are ignored. Precedence is this header,
        then the `Timezone` header, `timezone` cookie, and JSON `timezone` field.
      schema:
        type: string
      example: Europe/Vilnius
    TimezoneHeader:
      name: Timezone
      in: header
      required: false
      description: Fallback timezone if X-Timezone is absent or invalid.
      schema:
        type: string
    TimezoneCookie:
      name: timezone
      in: cookie
      required: false
      description: Fallback timezone if both timezone headers are absent or invalid.
      schema:
        type: string

  responses:
    InternalError:
      description: Internal or database failure; the error text may vary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VerificationUnavailable:
      description: Verification email URL is not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Verification email is not configured

  schemas:
    MusicoCursor:
      type: string
      description: Opaque change-feed cursor. `0` denotes an empty history; other values identify a specific change-log entry and must be sent back unchanged.
      pattern: '^(0|[1-9][0-9]*\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
    MusicoSnapshot:
      type: object
      required: [cursor, tracks, playlists]
      properties:
        cursor: {$ref: '#/components/schemas/MusicoCursor'}
        tracks:
          type: array
          items: {$ref: '#/components/schemas/MusicoTrack'}
        playlists:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/MusicoPlaylist'}
              - type: object
                required: [track_ids]
                properties:
                  track_ids:
                    type: array
                    items: {type: integer, format: int64, minimum: 1}
    MusicoChangePage:
      type: object
      required: [changes, next_cursor, has_more]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [cursor, resource, id, action, created]
            properties:
              cursor: {$ref: '#/components/schemas/MusicoCursor'}
              resource: {type: string, enum: [track, playlist]}
              id: {type: integer, format: int64, minimum: 1}
              action: {type: string, enum: [upsert, delete]}
              created: {type: string}
        next_cursor: {$ref: '#/components/schemas/MusicoCursor'}
        has_more: {type: boolean}
    MediaAudio:
      type: object
      required: [id, name, mime_type, size_bytes, sha256, created]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        mime_type: {type: string, enum: [audio/mpeg, audio/ogg, audio/wav, audio/flac, audio/mp4]}
        size_bytes: {type: integer, minimum: 1, maximum: 25165824}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        created: {type: string}
        musico_song_ids:
          type: array
          description: Included in the Media list; songs that currently reference this file.
          items: {type: integer, format: int64, minimum: 1}
    MusicoTrack:
      type: object
      required: [id, title, artist, original_name, mime_type, size_bytes, content_sha256, media_audio_id, version, stats_version, album, genre, year, track_number, rating, play_count, listen_ms, art_image_id, analysis, created]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        artist: {type: string}
        original_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the original audio bytes. Stable across uploads of the same file, including uploads from different devices on this account.
        media_audio_id: {type: integer, format: int64, minimum: 1}
        version: {type: integer, format: int64, minimum: 1}
        stats_version: {type: integer, format: int64, minimum: 1}
        album: {type: string}
        genre: {type: string}
        year: {type: [integer, 'null']}
        track_number: {type: [integer, 'null']}
        rating: {type: [integer, 'null']}
        play_count: {type: integer, minimum: 0}
        listen_ms: {type: integer, minimum: 0}
        art_image_id: {type: [integer, 'null'], minimum: 1}
        analysis:
          oneOf:
            - {$ref: '#/components/schemas/MusicoAnalysis'}
            - {type: 'null'}
        created: {type: string}
    MusicoAnalysis:
      type: object
      additionalProperties: false
      required: [duration_ms, bit_rate, sample_rate_hz, bit_depth, channels, codec, estimated_bpm, estimated_key, peak_db, average_db, dynamic_range_db]
      properties:
        duration_ms: {type: [integer, 'null'], minimum: 0, maximum: 86400000}
        bit_rate: {type: [integer, 'null'], minimum: 1, maximum: 1000000000}
        sample_rate_hz: {type: [integer, 'null'], minimum: 1, maximum: 1000000}
        bit_depth: {type: [integer, 'null'], minimum: 1, maximum: 64}
        channels: {type: [integer, 'null'], minimum: 1, maximum: 64}
        codec: {type: [string, 'null'], minLength: 1, maxLength: 100}
        estimated_bpm: {type: [integer, 'null'], minimum: 30, maximum: 300}
        estimated_key: {type: [string, 'null'], minLength: 1, maxLength: 32}
        peak_db: {type: [number, 'null'], minimum: -200, maximum: 20}
        average_db: {type: [number, 'null'], minimum: -200, maximum: 20}
        dynamic_range_db: {type: [number, 'null'], minimum: 0, maximum: 220}
    MusicoPlaylist:
      type: object
      required: [id, name, track_count, version, created]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        track_count: {type: integer}
        version: {type: integer, format: int64, minimum: 1}
        created: {type: string}
    Quiz:
      type: object
      required: [id, name, description, play_style, show_correct_answers, is_public, allow_go_back, randomize_questions, randomize_answers, question_limit, time_limit_seconds, play_count, created]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        play_style:
          type: string
          enum: [basic, game_show]
          description: Both styles support drag activities for matching, ordering, and categorizing. Game Show presents answers as larger, colorful game tiles.
        show_correct_answers:
          type: boolean
          description: Solutions appear in reviews only after an attempt is completed.
        is_public:
          type: boolean
          description: Whether signed-in users can find and start this quiz in Explore.
        allow_go_back:
          type: boolean
          description: Whether players can return to previous questions and change earlier answers.
        randomize_questions:
          type: boolean
          description: Select question order randomly when an attempt starts.
        randomize_answers:
          type: boolean
          description: Shuffle choice options, match keyword rows, and category labels per attempt. Match definitions, ordering items, category items, and blank image choices retain their protective shuffling regardless of this setting.
        question_limit:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
          description: "null means All questions once; 0 continues until Finish; a positive number asks that many. Numeric modes cycle in order or draw randomly with repeats, but random draws do not repeat the previous question unless the bank has only one question."
        time_limit_seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 86400
          description: Whole quiz limit; null means no limit. An attempt's clock starts when it is created.
        play_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Number of attempts started for this quiz, including the current unfinished attempt.
        created:
          type: string
          description: PostgreSQL timestamp without timezone, formatted as YYYY-MM-DD HH:MM:SS.
    QuizExport:
      type: object
      required: [format, version, name, description, questions, images]
      properties:
        format:
          type: string
          const: softerr-quiz
        version:
          type: integer
          const: 1
        name:
          type: string
          minLength: 1
          description: Trimmed before validation; at most 100 bytes.
        description:
          type: string
          description: Trimmed before validation; at most 1000 bytes.
        play_style:
          type: string
          enum: [basic, game_show]
          default: basic
        show_correct_answers:
          type: boolean
          default: false
        is_public:
          type: boolean
          default: false
        allow_go_back:
          type: boolean
          default: true
        randomize_questions:
          type: boolean
          default: false
        randomize_answers:
          type: boolean
          default: false
        question_limit:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
          default: null
        time_limit_seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 86400
          default: null
        questions:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/QuestionInput'
        images:
          type: array
          description: Each referenced image is included once as base64 data.
          maxItems: 4096
          items:
            type: object
            required: [id, name, data]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
                description: Original filename, at most 255 UTF-8 bytes.
              data:
                type: string
                contentEncoding: base64
              source:
                $ref: '#/components/schemas/ImageSource'
    QuizAttemptSummary:
      type: object
      required: [id, quiz_id, play_style, allow_go_back, randomize_questions, randomize_answers, question_limit, created, completed]
      properties:
        id: { type: integer, format: int64 }
        quiz_id: { type: integer, format: int64 }
        play_style: { type: string, enum: [basic, game_show] }
        allow_go_back: { type: boolean }
        randomize_questions: { type: boolean }
        randomize_answers: { type: boolean }
        question_limit: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        created: { type: string }
        completed: { type: [string, 'null'] }
        question_count: { type: integer }
        answered_count: { type: integer }
    QuizAttempt:
      allOf:
        - $ref: '#/components/schemas/QuizAttemptSummary'
        - type: object
          required: [questions, answers, question_count, score, furthest_position, time_limit_seconds, deadline_ms, server_time_ms]
          properties:
            furthest_position: { type: integer, minimum: 0, description: Highest question position opened in this attempt. }
            time_limit_seconds: { type: [integer, 'null'], minimum: 1, maximum: 86400 }
            deadline_ms: { type: [integer, 'null'], description: Unix milliseconds when the whole quiz expires. }
            server_time_ms: { type: integer, description: Server Unix milliseconds for client countdown alignment. }
            question_count: { type: integer, minimum: 1, description: Total prepared appearances in a fixed attempt, or appearances created so far in Until finish mode. }
            score:
              type: [object, 'null']
              description: Server-calculated score, available only after completion. Ungraded includes open, Show answer, and No answer questions.
              properties:
                graded: { type: integer, minimum: 0 }
                correct: { type: integer, minimum: 0 }
                ungraded: { type: integer, minimum: 0 }
            questions:
              type: array
              description: Only reached question appearances are returned while an attempt is active. Completed attempts return all appearances. Each has a unique ID, even when a source question repeats.
              items:
                type: object
                required: [id, source_question_id, template, prompt, config, started, time_limit_seconds, deadline_ms, time_spent_ms]
                properties:
                  id: { type: integer, format: int64 }
                  source_question_id: { type: integer, format: int64 }
                  template: { type: string }
                  prompt: { type: string }
                  config: { type: object, description: Play presentation without answer keys. Match definitions, ordering items, blank image choices, and category items are shuffled independently of their solutions. }
                  solution: { type: object, description: Full source configuration, present only after completion when show_correct_answers is enabled. }
                  correct: { type: [boolean, 'null'], description: Server result for this question, present only with solution. Null means it is not automatically graded. }
                  started: { type: boolean, description: Whether this question's clock or navigation position has started. }
                  time_spent_ms: { type: integer, minimum: 0, description: Client reported cumulative foreground time viewing this question appearance. }
                  time_limit_seconds: { type: [integer, 'null'], minimum: 1, maximum: 86400 }
                  deadline_ms: { type: [integer, 'null'], description: Unix milliseconds when this question expires, set on first opening. }
            answers:
              type: object
              description: Map from question appearance ID to saved answer object.
              additionalProperties: { type: object }
    QuizImage:
      type: object
      required: [id, name, mime_type, width, height, size_bytes, scope, group_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Image filename, initially the uploaded filename.
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        width:
          type: integer
        height:
          type: integer
        size_bytes:
          type: integer
          minimum: 1
          description: Size of the stored image in bytes.
        scope:
          type: string
          enum: [personal, shared]
        group_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Shared media folder, or null for ungrouped and personal images.
        source:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ImageSource'
    ImageSource:
      type: object
      required: [page, creator, license, license_url, attribution]
      properties:
        page: {type: string, format: uri}
        creator: {type: string}
        license: {type: string}
        license_url: {type: [string, 'null'], format: uri}
        attribution: {type: string}
    MediaGroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique folder name, at most 100 UTF-8 bytes after trimming.
    MediaGroup:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        image_count: {type: integer, minimum: 0}
        cover_image_id: {type: [integer, 'null'], format: int64, minimum: 1}
    QuestionInput:
      type: object
      required: [template, prompt, config]
      description: |
        `prompt` is trimmed and limited to 500 bytes. `config` depends on the
        template; see the question template table in docs/api.md. Choice, match,
        ordering, fill-in-the-blanks, and categorization templates have minimum
        row counts but no fixed maximum. Request size and prompt length still
        bound them. Answers and sample answers have the limits described there.
        Optional `config.image_id` and `config.answer_image_id` refer to reusable
        personal images owned by the account or published shared images. Choice options may also have `image_id`.
        Match pairs may use `keyword_image_id` and `definition_image_id`;
        categories may use `name_image_id`. Ordering items, blank answers, and
        category items are `{text, image_id?}` objects. The same
        image ID may be used in multiple fields.
      properties:
        template:
          type: string
          enum: [multiple_choice, one_choice, number, short_answer, open, true_false, yes_no, show_answer, no_answer, match, ordering, fill_blanks, categorize]
        prompt:
          type: string
          minLength: 1
          maxLength: 500
        config:
          type: object
        time_limit_seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 86400
          description: Limit for this question; null means no limit. The clock starts when this question is first opened in an attempt.
      example:
        template: multiple_choice
        prompt: Select the prime numbers
        config:
          options:
            - {text: '2', correct: true}
            - {text: '3', correct: true}
            - {text: '4', correct: false}
    Question:
      allOf:
        - $ref: '#/components/schemas/QuestionInput'
        - type: object
          required: [id, quiz_id, created]
          properties:
            id:
              type: integer
              format: int64
            quiz_id:
              type: integer
              format: int64
            created:
              type: string
              description: PostgreSQL timestamp without timezone, formatted as YYYY-MM-DD HH:MM:SS.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Trimmed and lowercased; at most 255 bytes.
    PasswordResetRequested:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: If this account exists, a password reset email will be sent
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: At most 1024 bytes.
    PasswordResetCompleted:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Password updated. Please log in.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Trimmed and lowercased; at most 255 bytes.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: At most 1024 bytes.
    MobileTokens:
      type: object
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_in, user]
      properties:
        token_type: {type: string, const: Bearer}
        access_token: {type: string, pattern: '^mat_[A-Za-z0-9_-]{43}$'}
        expires_in: {type: integer, minimum: 1, maximum: 900}
        refresh_token: {type: string, pattern: '^mrt_[A-Za-z0-9_-]{43}$'}
        refresh_expires_in: {type: integer, minimum: 1, maximum: 2592000}
        user: {$ref: '#/components/schemas/User'}
    LogoutResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Logged out
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error; clients should use the HTTP status.
    Readiness:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: ok
        message:
          type: string
          const: API is ready
    ReadinessUnavailable:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          const: unavailable
        error:
          type: string
    SignupRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 1
          description: Trimmed before validation; must be nonempty and at most 100 bytes.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Must be nonempty and at most 1024 bytes.
        email:
          type: string
          format: email
          minLength: 1
          description: Trimmed and lowercased; must be at most 255 bytes.
        timezone:
          type: string
          description: Fallback IANA timezone if no valid header or cookie is supplied.
    ResendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Trimmed and lowercased; must be at most 255 bytes.
        timezone:
          type: string
          description: Fallback IANA timezone if no valid header or cookie is supplied.
    User:
      type: object
      required: [id, username, email, role, verified, approved, created]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: [string, 'null']
          format: email
        account_kind: {type: string, enum: [human, service]}
        api_token_id: {type: [integer, 'null'], minimum: 1}
        role:
          type: string
          enum: [admin, mod, user]
          description: Server-assigned account role. Signup always assigns user.
        verified:
          type: boolean
        approved:
          type: boolean
          description: True after an admin approves the verified account.
        created:
          type: string
          description: |
            PostgreSQL timestamp without timezone, usually formatted as
            `YYYY-MM-DD HH:MM:SS`. No timezone or UTC guarantee is encoded;
            clients should not parse it as an instant without an agreed timezone.
          example: '2026-10-26 14:30:00'
    TokenQuizAccess:
      type: object
      required: [all, quizzes]
      properties:
        all: {type: string, enum: [none, read, edit]}
        quizzes:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, permission]
            properties:
              id: {type: integer, minimum: 1}
              permission: {type: string, enum: [read, edit]}
      description: When all is read or edit, quizzes must be empty. When all is none, quizzes lists selected creator-owned quizzes.
    ApiToken:
      type: object
      required: [id, name, user_id, username, quiz_access, scopes, created, expires, last_used_at, revoked_at]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string}
        user_id: {type: integer, minimum: 1}
        username: {type: string}
        quiz_access: {$ref: '#/components/schemas/TokenQuizAccess'}
        scopes:
          type: array
          items: {type: string, enum: ['quiz:read', 'quiz:write', 'media:read', 'media:write']}
        created: {type: string, format: date-time}
        expires: {type: [string, 'null'], format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    UsersResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [deleting]
          properties:
            deleting:
              type: boolean
              description: Account is blocked while quiz data cleanup is pending; retry DELETE to finish.
    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, mod, user]
    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [verification_email_queued]
          properties:
            verification_email_queued:
              type: boolean
              const: true
    ResendResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Verification email request accepted
