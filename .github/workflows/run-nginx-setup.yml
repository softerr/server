name: Run Server Scripts On Server

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: "Comma-separated script names from scripts/ (example: setup_nginx.sh,other.sh). Use 'all' to run all .sh files."
        required: false
        default: all

jobs:
  run-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_PATH="$HOME/.ssh/server_key"
          if printf '%s' "$SERVER_SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s' "$SERVER_SSH_KEY" | tr -d '\r' > "$KEY_PATH"
          else
            printf '%s' "$SERVER_SSH_KEY" | tr -d '\r' | base64 -d > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          ssh-keygen -y -f "$KEY_PATH" >/dev/null
          PORT="${SERVER_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Copy and execute server scripts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SCRIPT_LIST: ${{ github.event.inputs.scripts }}
        run: |
          set -euo pipefail
          PORT="${SERVER_PORT:-22}"
          KEY_PATH="$HOME/.ssh/server_key"
          SSH_OPTS="-i $KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          REMOTE_DIR="/tmp/workflow-artifacts"

          ssh $SSH_OPTS -p "$PORT" "$SERVER_USER@$SERVER_HOST" "rm -rf '$REMOTE_DIR' && mkdir -p '$REMOTE_DIR/scripts' '$REMOTE_DIR/app'"
          scp $SSH_OPTS -P "$PORT" scripts/*.sh "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/scripts/"
          if [[ -d app/quiz ]]; then
            scp $SSH_OPTS -P "$PORT" -r app/quiz "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/app/"
          else
            echo "Missing app/quiz in repository."
            exit 1
          fi

          ssh $SSH_OPTS -p "$PORT" "$SERVER_USER@$SERVER_HOST" "SCRIPT_LIST='$SCRIPT_LIST' bash -s" <<'EOF'
          set -euo pipefail
          cd /tmp/workflow-artifacts/scripts

          run_script() {
            local script_name="$1"
            if [[ ! "$script_name" =~ ^[A-Za-z0-9._-]+\.sh$ ]]; then
              echo "Invalid script name: $script_name"
              exit 1
            fi
            if [[ ! -f "$script_name" ]]; then
              echo "Script not found on server: scripts/$script_name"
              exit 1
            fi
            chmod +x "$script_name"
            echo "Running: scripts/$script_name"
            sudo bash "/tmp/workflow-artifacts/scripts/$script_name"
          }

          if [[ "${SCRIPT_LIST:-all}" == "all" ]]; then
            mapfile -t scripts_to_run < <(find . -maxdepth 1 -type f -name '*.sh' -printf '%f\n' | sort)
            if [[ "${#scripts_to_run[@]}" -eq 0 ]]; then
              echo "No .sh scripts found in /tmp/workflow-artifacts/scripts"
              exit 1
            fi
            for script_name in "${scripts_to_run[@]}"; do
              run_script "$script_name"
            done
          else
            normalized="${SCRIPT_LIST//,/ }"
            read -r -a requested <<< "$normalized"
            if [[ "${#requested[@]}" -eq 0 ]]; then
              echo "No scripts requested."
              exit 1
            fi
            for script_name in "${requested[@]}"; do
              run_script "$script_name"
            done
          fi
          EOF
