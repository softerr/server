name: Setup PostgreSQL On Server

on:
  workflow_dispatch:

jobs:
  setup-postgresql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          bash scripts/ci/configure_ssh_for_actions.sh

      - name: Upload setup script and configs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          bash scripts/ci/upload_artifacts.sh postgresql

      - name: Run PostgreSQL setup
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          PROVISION_COMPONENTS: postgresql
          POSTGRES_AUTH_API_PASSWORD: ${{ secrets.POSTGRES_AUTH_API_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${POSTGRES_AUTH_API_PASSWORD:-}" ]]; then
            echo "Missing required GitHub secret: POSTGRES_AUTH_API_PASSWORD"
            exit 1
          fi
          REQUIRED_ENV_VARS="PROVISION_COMPONENTS,POSTGRES_AUTH_API_PASSWORD" \
            bash scripts/ci/run_remote_setup.sh provision.sh
