name: Setup PostgreSQL On Server

on:
  workflow_dispatch:

jobs:
  setup-postgresql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          bash scripts/ci/configure_ssh_for_actions.sh

      - name: Upload setup script and configs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          source scripts/ci/load_ssh_env.sh

          ssh $SSH_OPTS -p "$PORT" "$SERVER_USER@$SERVER_HOST" "rm -rf '$REMOTE_DIR' && mkdir -p '$REMOTE_DIR/scripts' '$REMOTE_DIR/configs'"
          scp $SSH_OPTS -P "$PORT" scripts/setup_postgresql.sh "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/scripts/"
          scp $SSH_OPTS -P "$PORT" -r configs/. "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/configs/"

      - name: Run PostgreSQL setup
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          POSTGRES_AUTH_API_PASSWORD: ${{ secrets.POSTGRES_AUTH_API_PASSWORD }}
        run: |
          set -euo pipefail
          source scripts/ci/load_ssh_env.sh
          if [[ -z "${POSTGRES_AUTH_API_PASSWORD:-}" ]]; then
            echo "Missing required GitHub secret: POSTGRES_AUTH_API_PASSWORD"
            exit 1
          fi

          POSTGRES_AUTH_API_PASSWORD_B64="$(printf '%s' "$POSTGRES_AUTH_API_PASSWORD" | base64 -w 0)"
          ssh $SSH_OPTS -p "$PORT" "$SERVER_USER@$SERVER_HOST" "POSTGRES_AUTH_API_PASSWORD_B64='$POSTGRES_AUTH_API_PASSWORD_B64' bash -s" <<'EOF'
          set -euo pipefail
          POSTGRES_AUTH_API_PASSWORD="$(printf '%s' "$POSTGRES_AUTH_API_PASSWORD_B64" | base64 -d)"
          chmod +x /tmp/workflow-artifacts/scripts/setup_postgresql.sh
          sudo env POSTGRES_AUTH_API_PASSWORD="$POSTGRES_AUTH_API_PASSWORD" \
            bash /tmp/workflow-artifacts/scripts/setup_postgresql.sh
          EOF
