name: Setup Nginx On Server

on:
  workflow_dispatch:

jobs:
  setup-nginx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          bash scripts/ci/configure_ssh_for_actions.sh

      - name: Upload setup script and configs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          bash scripts/ci/upload_artifacts.sh nginx

      - name: Run Nginx setup
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          PROVISION_COMPONENTS: nginx
          API_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
          API_MAIL_FROM: ${{ secrets.API_MAIL_FROM }}
          API_APP_BASE_URL: ${{ secrets.API_APP_BASE_URL }}
          API_SMTP_HOST: ${{ secrets.API_SMTP_HOST }}
          API_SMTP_PORT: ${{ secrets.API_SMTP_PORT }}
          API_SMTP_ENCRYPTION: ${{ secrets.API_SMTP_ENCRYPTION }}
          API_SMTP_USERNAME: ${{ secrets.API_SMTP_USERNAME }}
          API_SMTP_PASSWORD: ${{ secrets.API_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${API_DB_PASSWORD:-}" ]]; then
            echo "Missing required GitHub secret: API_DB_PASSWORD"
            exit 1
          fi
          REQUIRED_ENV_VARS="PROVISION_COMPONENTS,API_DB_PASSWORD" \
          OPTIONAL_ENV_VARS="API_MAIL_FROM,API_APP_BASE_URL,API_SMTP_HOST,API_SMTP_PORT,API_SMTP_ENCRYPTION,API_SMTP_USERNAME,API_SMTP_PASSWORD" \
            bash scripts/ci/run_remote_setup.sh provision.sh
