name: Test API In QEMU

on:
  workflow_dispatch:
    inputs:
      require_db_checks:
        description: "Require DB-backed verify success check."
        type: choice
        options:
          - "1"
          - "0"
        required: false
        default: "1"
      require_email_checks:
        description: "Require signup email delivery checks."
        type: choice
        options:
          - "1"
          - "0"
        required: false
        default: "1"

jobs:
  test-api-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_ENABLE_CHAOS: "true"
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare QEMU test environment
        run: |
          set -euo pipefail

          echo "SSH_PORT=22022" >> "$GITHUB_ENV"
          echo "HTTP_PORT=18080" >> "$GITHUB_ENV"
          echo "WAIT_SSH_SECONDS=600" >> "$GITHUB_ENV"
          echo "RECREATE_VM_DISK=1" >> "$GITHUB_ENV"
          echo "API_TEST_BASE_URL=http://127.0.0.1" >> "$GITHUB_ENV"
          echo "API_SMTP_HOST=10.0.2.2" >> "$GITHUB_ENV"
          echo "API_SMTP_PORT=1025" >> "$GITHUB_ENV"
          echo "API_SMTP_ENCRYPTION=none" >> "$GITHUB_ENV"
          echo "API_MAIL_FROM=no-reply@example.test" >> "$GITHUB_ENV"
          echo "API_TEST_MAILPIT_URL=http://10.0.2.2:8025" >> "$GITHUB_ENV"

      - name: Wait for local mail catcher
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8025/api/v1/chaos >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready."
          exit 1

      - name: Start and provision QEMU VM
        run: |
          set -euo pipefail
          bash scripts/qemu.sh start

      - name: Run API tests in QEMU
        env:
          API_TEST_REQUIRE_DB: ${{ github.event.inputs.require_db_checks }}
          API_TEST_REQUIRE_EMAIL: ${{ github.event.inputs.require_email_checks }}
        run: |
          set -euo pipefail
          bash scripts/qemu.sh test-api

      - name: Stop QEMU VM
        if: always()
        run: |
          set -euo pipefail
          bash scripts/qemu.sh stop || true
