name: Test Deployment

on:
  pull_request:
    paths:
      - "app/**"
      - "app/*/app.tsv"
      - "configs/nginx/**"
      - "configs/postgresql/**"
      - "configs/systemd/**"
      - "scripts/ci/**"
      - "scripts/lint.sh"
      - "scripts/deploy_*.sh"
      - "scripts/lib/**"
      - "scripts/provision.sh"
      - "scripts/qemu.sh"
      - "scripts/setup_nginx.sh"
      - "scripts/setup_php_fpm.sh"
      - "scripts/setup_email_worker.sh"
      - "scripts/setup_server.sh"
      - "scripts/bootstrap_server.sh"
      - "scripts/setup_tls_certificate.sh"
      - "scripts/setup_postgresql.sh"
      - "scripts/backup_postgresql.sh"
      - "tests/deploy/**"
      - "tests/api/**"
      - "tests/db/**"
      - "scripts/test_api.sh"
      - "scripts/test_openapi.sh"
      - "scripts/test_openapi_authenticated.sh"
      - ".github/workflows/deploy-apps.yml"
      - ".github/workflows/setup-nginx.yml"
      - ".github/workflows/setup-server.yml"
      - ".github/workflows/setup-postgresql.yml"
      - ".github/workflows/test-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "app/*/app.tsv"
      - "configs/nginx/**"
      - "configs/postgresql/**"
      - "configs/systemd/**"
      - "scripts/ci/**"
      - "scripts/lint.sh"
      - "scripts/deploy_*.sh"
      - "scripts/lib/**"
      - "scripts/provision.sh"
      - "scripts/qemu.sh"
      - "scripts/setup_nginx.sh"
      - "scripts/setup_php_fpm.sh"
      - "scripts/setup_email_worker.sh"
      - "scripts/setup_server.sh"
      - "scripts/bootstrap_server.sh"
      - "scripts/setup_tls_certificate.sh"
      - "scripts/setup_postgresql.sh"
      - "scripts/backup_postgresql.sh"
      - "tests/deploy/**"
      - "tests/api/**"
      - "tests/db/**"
      - "scripts/test_api.sh"
      - "scripts/test_openapi.sh"
      - "scripts/test_openapi_authenticated.sh"
      - ".github/workflows/deploy-apps.yml"
      - ".github/workflows/setup-nginx.yml"
      - ".github/workflows/setup-server.yml"
      - ".github/workflows/setup-postgresql.yml"
      - ".github/workflows/test-deploy.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PHP and ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli shellcheck

      - name: Check PHP and shell
        run: bash scripts/lint.sh

  test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check app registry and modules
        run: bash tests/deploy/app_registry.sh

      - name: Check media archive verification
        run: python3 tests/deploy/media_archive.py

      - name: Check atomic app replacement
        run: bash tests/deploy/atomic_deploy.sh

      - name: Check pinned SSH host key
        run: bash tests/deploy/ssh_host_key.sh

      - name: Check TLS certificate validation
        run: bash tests/deploy/tls_certificate.sh

      - name: Check running VM disk recreation guard
        run: bash tests/deploy/qemu_recreation.sh

      - name: Build web apps
        run: bash scripts/ci/build_web_apps.sh all

      - name: Check app frontends
        run: bash scripts/ci/check_apps.sh

      - name: Install Nginx for config validation
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi

      - name: Check rendered Nginx config
        run: |
          set -euo pipefail
          TLS_TEST_DIR="$(mktemp -d)"
          export TLS_TEST_DIR
          trap 'sudo rm -f /etc/nginx/softerr-http-ci.conf /etc/nginx/softerr-tls-ci.conf /etc/nginx/softerr-http-staged-ci.conf /etc/nginx/softerr-tls-staged-ci.conf /etc/nginx/snippets/softerr-routes.conf; rm -rf -- "${TLS_TEST_DIR}"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=example.test' \
            -keyout "${TLS_TEST_DIR}/key.pem" -out "${TLS_TEST_DIR}/cert.pem" >/dev/null 2>&1
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          tls_dir = Path(os.environ['TLS_TEST_DIR'])
          routes = Path('configs/nginx/softerr-routes.conf.template').read_text()
          web_routes = subprocess.check_output(['bash', '-c',
              'set -euo pipefail; source scripts/lib/app_registry.sh; load_app_registry "$PWD"; render_web_app_routes'],
              text=True)
          api_routes = subprocess.check_output(['bash', '-c',
              'set -euo pipefail; source scripts/lib/app_registry.sh; load_app_registry "$PWD"; render_app_api_routes "$PWD"'],
              text=True)
          assert routes.count('__WEB_APP_ROUTES__') == 1
          assert routes.count('__APP_API_ROUTES__') == 1
          routes = routes.replace('__WEB_APP_ROUTES__', web_routes).replace('__APP_API_ROUTES__', api_routes)
          assert 'location = /musico {' in routes
          assert 'location /musico/ {' in routes
          assert 'location = /mdb {' in routes
          assert 'location /mdb/ {' in routes
          assert 'location = /api/quiz.php {' in routes
          assert 'location = /api/media.php {' in routes
          assert 'location = /api/musico.php {' in routes
          assert 'location = /api/mdb.php {' in routes
          assert 'location ~ ^/api/(index|auth)\\.php$ {' in routes
          assert 'location /api/auth/' in routes
          assert 'location /api/quiz/' in routes
          assert 'location /api/media/' in routes
          assert 'location ~ ^/api/media/audio(?:/|$) {' in routes
          assert 'location /api/musico/' in routes
          assert 'location /api/mdb/' in routes
          assert routes.count('client_max_body_size 10m;') == 2
          assert routes.count('client_max_body_size 26m;') == 4
          assert 'location ~ ^/api/quiz/quizzes/import/*$ {' in routes
          assert 'client_max_body_size 48m;' in routes
          assert 'client_max_body_size 2m;' in routes
          assert routes.count('client_max_body_size 6m;') == 1
          assert 'location ~ ^/api/.*\\.php$' in routes
          assert 'location ~ ^/api/auth/signup/*$' in routes
          assert 'client_max_body_size 4k;' in routes
          assert 'limit_req zone=softerr_signup burst=20 nodelay;' in routes
          assert 'location ~ ^/api/auth/resend-verification/*$' in routes
          assert 'limit_req zone=softerr_resend burst=10 nodelay;' in routes
          assert 'location ~ ^/api/auth/login/*$' in routes
          assert 'limit_req zone=softerr_login burst=10 nodelay;' in routes
          assert 'location ~ ^/api/auth/password-reset/request/*$' in routes
          assert 'limit_req zone=softerr_reset_request burst=5 nodelay;' in routes
          assert 'location ~ ^/api/auth/password-reset/confirm/*$' in routes
          assert 'limit_req zone=softerr_reset_confirm burst=10 nodelay;' in routes
          assert 'limit_req_status 429;' in routes
          routes = routes.replace('__PHP_FPM_SOCK__', '/run/php/php-fpm.sock')
          assert '__PHP_FPM_SOCK__' not in routes
          (tls_dir / 'routes.conf').write_text(routes)
          for mode, filename in [('http', 'softerr.conf.template'), ('tls', 'softerr-tls.conf.template')]:
              template = Path('configs/nginx', filename).read_text()
              assert 'limit_req_zone $binary_remote_addr zone=softerr_signup:10m rate=20r/m;' in template
              assert 'limit_req_zone $binary_remote_addr zone=softerr_resend:10m rate=10r/m;' in template
              assert 'limit_req_zone $binary_remote_addr zone=softerr_login:10m rate=10r/m;' in template
              assert 'limit_req_zone $binary_remote_addr zone=softerr_reset_request:10m rate=5r/m;' in template
              assert 'limit_req_zone $binary_remote_addr zone=softerr_reset_confirm:10m rate=10r/m;' in template
              site = (template
                  .replace('__PHP_FPM_SOCK__', '/run/php/php-fpm.sock')
                  .replace('__TLS_ORIGIN__', 'https://example.test')
                  .replace('__TLS_CERT_FILE__', str(tls_dir / 'cert.pem'))
                  .replace('__TLS_KEY_FILE__', str(tls_dir / 'key.pem')))
              assert '__TLS_' not in site and '__PHP_FPM_SOCK__' not in site
              if mode == 'tls':
                  assert 'listen 443 ssl default_server;' in site
                  assert 'return 308 https://example.test$request_uri;' in site
                  assert 'Strict-Transport-Security' in site
              (tls_dir / f'{mode}.conf').write_text('events {}\nhttp {\n' + site + '\n}\n')
              staged_site = site.replace(
                  'include /etc/nginx/snippets/softerr-routes.conf;',
                  f'include {tls_dir}/routes.conf;')
              assert staged_site != site
              (tls_dir / f'{mode}-staged.conf').write_text('events {}\nhttp {\n' + staged_site + '\n}\n')
          bootstrap = Path('configs/nginx/softerr-bootstrap.conf').read_text()
          assert 'location ^~ /.well-known/acme-challenge/' in bootstrap
          (tls_dir / 'bootstrap.conf').write_text('events {}\nhttp {\n' + bootstrap + '\n}\n')
          PY
          sudo install -m 644 "${TLS_TEST_DIR}/routes.conf" /etc/nginx/snippets/softerr-routes.conf
          for mode in http tls bootstrap; do
            sudo install -m 644 "${TLS_TEST_DIR}/${mode}.conf" "/etc/nginx/softerr-${mode}-ci.conf"
            sudo nginx -t -c "/etc/nginx/softerr-${mode}-ci.conf"
          done
          for mode in http tls; do
            sudo install -m 644 "${TLS_TEST_DIR}/${mode}-staged.conf" "/etc/nginx/softerr-${mode}-staged-ci.conf"
            sudo nginx -t -c "/etc/nginx/softerr-${mode}-staged-ci.conf"
          done
