name: Deploy Apps On Server

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Select app deployment target."
        type: choice
        options:
          - all
          - quiz
          - api
        required: false
        default: all

jobs:
  deploy-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build quiz app on GitHub runner
        run: |
          set -euo pipefail
          if [[ -d app/quiz ]]; then
            cd app/quiz
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
            npm run build
          else
            echo "Missing app/quiz in repository."
            exit 1
          fi

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          bash scripts/ci/configure_ssh_for_actions.sh

      - name: Upload apps and deploy scripts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          bash scripts/ci/upload_artifacts.sh apps

      - name: Run app deploy scripts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          APP_LIST: ${{ github.event.inputs.apps }}
        run: |
          set -euo pipefail
          case "${APP_LIST:-all}" in
            all)
              PROVISION_COMPONENTS="apps"
              ;;
            quiz|api)
              PROVISION_COMPONENTS="${APP_LIST}"
              ;;
            *)
              echo "Invalid apps input: ${APP_LIST}"
              exit 1
              ;;
          esac
          export PROVISION_COMPONENTS
          REQUIRED_ENV_VARS="PROVISION_COMPONENTS" \
            bash scripts/ci/run_remote_setup.sh provision.sh
