name: Deploy Apps On Server

on:
  workflow_dispatch:
    inputs:
      apps:
        type: string
        description: "App to deploy: all, api, or an ID from an app manifest."
        required: false
        default: all

concurrency:
  group: production-server
  queue: max

jobs:
  deploy-apps:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_LIST: ${{ inputs.apps }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build selected web apps
        if: ${{ inputs.apps != 'api' }}
        run: bash scripts/ci/build_web_apps.sh "${APP_LIST:-all}"

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          bash scripts/ci/configure_ssh_for_actions.sh

      - name: Upload apps and deploy scripts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          bash scripts/ci/upload_artifacts.sh apps

      - name: Run app deploy scripts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          API_APP_BASE_URL: https://${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          APP_LIST="${APP_LIST:-all}"
          source scripts/lib/app_registry.sh
          load_app_registry "$PWD"
          if [[ "${APP_LIST}" == all || "${APP_LIST}" == api || -n "${APP_HEALTH_ROUTES[$APP_LIST]:-}" ]]; then
            PROVISION_COMPONENTS=nginx,apps
          else
            PROVISION_COMPONENTS=apps
          fi
          export APP_LIST PROVISION_COMPONENTS
          REQUIRED_ENV_VARS="PROVISION_COMPONENTS,APP_LIST,API_APP_BASE_URL" \
            bash scripts/ci/run_remote_setup.sh provision.sh
